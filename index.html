<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>残高ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="page">
    <h1>残高ダッシュボード</h1>
    <p>現在の残高から、今月まだ来ていないカード引き落としを差し引いて着地を確認します。</p>
  </header>

  <div class="hero">
    <div class="hero-main">
      <div class="label">着地予想残高(本日以降の引き落とし予定を差し引いた額)</div>
      <div class="amount" id="projectedAmount">¥0</div>
      <div class="as-of" id="asOf"></div>
    </div>
    <div class="hero-side">
      <div class="hero-row">
        <span class="k">現在の残高</span>
        <input type="text" class="balance-input" id="balanceInput" inputmode="numeric">
      </div>
      <div class="hero-row">
        <span class="k">今後の引き落とし予定合計</span>
        <span class="v" id="futureTotal">¥0</span>
      </div>
    </div>
  </div>

  <div class="section-title">カードごとの引き落とし予定 <span class="note">日付を過ぎた項目は自動で「済」になります</span></div>

  <div id="cardsContainer"></div>

  <div class="add-card-row">
    <input type="text" id="newCardNameInput" placeholder="新しい枠の名前(例: ○○ローン)">
    <button class="add-card-btn" id="addCardBtn">+ 新しい枠を追加</button>
  </div>

  <footer class="note">
    ブラウザを閉じるとデータはリセットされます(このデモは保存機能なしのプロトタイプです)。元シートでは合計欄が一部のカードしか足していない箇所がありましたが、ここでは全カードの予定額を正しく合算しています。
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
